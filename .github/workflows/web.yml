name: web

on:
  push:
    branches: [main]
    paths: ["app/**", "server/**", "assets/branding/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["app/**", "server/**", "assets/branding/**", ".github/workflows/web.yml"]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; main runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

env:
  NODE_OPTIONS: --max-old-space-size=1536

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun check
      - run: bun run --bun build

  browser:
    # One Chromium worker per shard. run-shard.ts deals test locations
    # round-robin, so the slow hall files spread across every shard.
    name: browser (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
      - uses: erlef/setup-beam@v1
        with:
          version-file: server/.tool-versions
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            server/deps
            server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('server/.tool-versions', 'server/mix.lock') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run --bun build
      - run: mix deps.get --check-locked && mix compile --warnings-as-errors
        working-directory: server
        env:
          MIX_ENV: test
      - run: bun run playwright install --with-deps chromium
      - run: bun run ./test/browser/run-shard.ts ${{ matrix.shard }}/6
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ matrix.shard }}
          path: app/test-results/
          if-no-files-found: ignore
