name: native packages

on:
  # A v* tag builds the clients for the hosted hall and drafts a GitHub
  # Release from them. GitHub skips path filters for tag pushes.
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "server/priv/content/**", "assets/branding/**", "packaging/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["app/**", "server/priv/content/**", "assets/branding/**", "packaging/**", ".github/workflows/native.yml"]
  workflow_dispatch:
    inputs:
      hall_origin:
        description: "HTTPS origin for these artifacts. Omit for a local hall."
        type: string

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; main runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  # Pushes to main and release tags target the hosted hall that Render deploys
  # from main; pull requests and dispatches without an input target a local hall.
  FEUD_HALL_NATIVE_ORIGIN: ${{ inputs.hall_origin || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'https://feud-hall.onrender.com') || 'http://localhost:4000' }}

jobs:
  # The trust-boundary tests build a debug binary; run them beside the release
  # packaging instead of before it.
  trust-boundary:
    name: trust boundary (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev librsvg2-dev
      - name: Install Rust from the pinned manifest
        working-directory: app/src-tauri
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run desktop:assets
        working-directory: app
      - name: Check native trust boundary
        working-directory: app/src-tauri
        run: cargo fmt --check && cargo test --locked --bin feud-hall

  packages:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app
          - os: ubuntu-24.04
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Every run keeps the version sources in step; a release tag must match them.
      - name: Check client version sources
        run: python3 packaging/check_version.py ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev librsvg2-dev flatpak flatpak-builder xvfb dbus-x11 gnome-keyring
      - name: Install Rust from the pinned manifest
        working-directory: app/src-tauri
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run desktop:assets
        working-directory: app
      - run: bun run desktop:build --ci --bundles ${{ matrix.bundle }} -- --locked
        working-directory: app
      - name: Verify and collect macOS bundle
        if: runner.os == 'macOS'
        run: |
          app='app/src-tauri/target/release/bundle/macos/Feud Hall.app'
          test -x "$app/Contents/MacOS/feud-hall"
          codesign --verify --strict --deep "$app"
          mkdir -p release
          ditto -c -k --keepParent "$app" "release/feud-hall-macos-${RUNNER_ARCH}.zip"
      - name: Build and install both Linux formats
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          packages=(app/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          mkdir -p release
          install -m644 "${packages[0]}" release/feud-hall-amd64.deb
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
          packaging/flatpak/build.sh release/feud-hall-amd64.deb release/feud-hall-x86_64.flatpak
          sudo apt-get install -y "$PWD/release/feud-hall-amd64.deb"
          test -x /usr/bin/feud-hall
          flatpak install --user --noninteractive -y release/feud-hall-x86_64.flatpak
          flatpak info --user --show-permissions io.github.adsouza.FeudHall
          for package in deb flatpak; do
            if [ "$package" = deb ]; then
              launch=(/usr/bin/feud-hall)
            else
              launch=(flatpak run --user io.github.adsouza.FeudHall)
            fi
            rc=0
            timeout 12s dbus-run-session -- xvfb-run -a "${launch[@]}" || rc=$?
            test "$rc" -eq 124
          done
      - name: Record provenance and checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path

          locks = [Path(path) for path in ("app/bun.lock", "app/src-tauri/Cargo.lock")]
          files = sorted(p for p in Path("release").iterdir() if p.is_file())
          checksum = lambda path: hashlib.file_digest(path.open("rb"), "sha256").hexdigest()
          manifest = {
              "revision": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "hall_origin": os.environ["FEUD_HALL_NATIVE_ORIGIN"],
              "client_protocol": 1,
              "runner": platform.platform(),
              "lockfiles": {str(p): checksum(p) for p in locks},
              "artifacts": {p.name: checksum(p) for p in files},
          }
          Path("release/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: feud-hall-${{ runner.os }}-${{ runner.arch }}
          path: release/
          if-no-files-found: error

  # A release tag drafts a GitHub Release once every package and trust-boundary
  # check has passed. Publishing the draft is a manual step after the installed
  # client checks in docs/DEPLOYMENT.md.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [trust-boundary, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: feud-hall-*
          path: artifacts
      - name: Collect release files
        run: |
          shopt -s nullglob
          mkdir release
          # Each platform has its own manifest.json; name it after the platform.
          for dir in artifacts/feud-hall-*/; do
            platform=$(basename "$dir" | sed 's/^feud-hall-//' | tr '[:upper:]' '[:lower:]')
            jq -e --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
              '.revision == $sha and .ref == $ref and (.hall_origin | startswith("https://"))' \
              "$dir/manifest.json"
            cp "$dir/manifest.json" "release/manifest-$platform.json"
            for file in "$dir"*; do
              [ "$(basename "$file")" = manifest.json ] || cp "$file" release/
            done
          done
          for file in feud-hall-amd64.deb feud-hall-x86_64.flatpak manifest-linux-x64.json; do
            test -f "release/$file"
          done
          macos=(release/feud-hall-macos-*.zip)
          test "${#macos[@]}" -eq 1
          (cd release && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS release/
          ls -l release
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run refreshes the assets of its own draft; it never touches a
          # release that has already been published.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo "::error::Release $TAG is already published"; exit 1; }
            gh release upload "$TAG" release/* --clobber
          else
            flags=(--draft --verify-tag --generate-notes --title "Feud Hall $TAG")
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" "${flags[@]}" release/*
          fi
