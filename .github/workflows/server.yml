name: server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; main runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

env:
  MIX_ENV: test

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: server/.tool-versions
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            server/deps
            server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('server/.tool-versions', 'server/mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # Full suite runs in hosted CI only; locally, run focused files.
      # Local full runs need the owner's permission.
      - run: mix test --warnings-as-errors

  mutation:
    # Bounded curated cohort, one worker per slice, each in a disposable copy.
    # Each slice verifies its own baseline before and after, so it does not
    # wait for the check job; the four slices together are the whole cohort.
    name: mutation (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: server/.tool-versions
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            server/deps
            server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('server/.tool-versions', 'server/mix.lock') }}
      - run: mix deps.get --check-locked && mix compile
      - run: elixir scripts/mutation_cohort.exs "$RUNNER_TEMP/mutation" --shard ${{ matrix.shard }}/4
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutation/mutation_report.txt
          if-no-files-found: ignore
