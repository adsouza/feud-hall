<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="360" viewBox="0 0 1500 360" role="img" aria-labelledby="title desc">
  <title id="title">Feud Hall logo</title>
  <desc id="desc">Food-hall emblem followed by custom ivory FEUD HALL lettering, on a transparent background.</desc>

  <g transform="translate(0 0) scale(.7)"><g id="hall-mark">
    <!-- Two rival roof slopes meet above one shared dining hall. -->
    <path d="M82 218 256 102 430 218" fill="none" stroke="#101523" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M82 218 256 102" fill="none" stroke="#FF6B5E" stroke-width="36" stroke-linecap="round"/>
    <path d="M256 102 430 218" fill="none" stroke="#58E0BB" stroke-width="36" stroke-linecap="round"/>
    <path d="M112 246V392H400V246" fill="none" stroke="#FFF4DC" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- A hot serving cloche; the counter and doorway share a silhouette. -->
    <path d="M178 324a78 78 0 0 1 156 0Z" fill="#FFC75B"/>
    <rect x="242" y="226" width="28" height="26" rx="13" fill="#FFC75B"/>
    <path d="M166 346H346" stroke="#FFF4DC" stroke-width="22" stroke-linecap="round"/>
    <path d="M238 392V366H274V392" fill="#101523"/>
  </g></g>
