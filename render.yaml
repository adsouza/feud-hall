services:
  - type: web
    name: feud-hall
    runtime: docker
    # Free instances sleep after 15 idle minutes, so the hall pauses: a
    # release-test configuration, not the always-running public hall.
    plan: free
    # Keep the database in the matching region (Neon: AWS us-east-1).
    region: virginia
    numInstances: 1
    autoDeployTrigger: checksPass
    # Image inputs only; the Dockerfile copies all of assets/.
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - render.yaml
        - app/**
        - server/**
        - assets/**
      ignoredPaths:
        - app/src-tauri/**
        - server/test/**
    healthCheckPath: /healthz
    # The image's CMD, bin/migrate_and_start, applies migrations before the
    # hall starts; the free plan has no pre-deploy command.
    envVars:
      - key: FEUD_HALL_SERVE
        value: '1'
      - key: FEUD_HALL_SECRET
        generateValue: true
      - key: FEUD_HALL_ADMIN_KEY
        sync: false
      # Neon's direct (non-pooler) connection string, pasted at import.
      - key: DATABASE_URL
        sync: false
