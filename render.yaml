services:
  - type: web
    name: feud-hall
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /healthz
    preDeployCommand: /app/bin/feud_hall eval 'FeudHall.Release.migrate()'
    envVars:
      - key: FEUD_HALL_SERVE
        value: '1'
      - key: FEUD_HALL_SECRET
        generateValue: true
      - key: FEUD_HALL_ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: feud-hall-db
          property: connectionString

databases:
  - name: feud-hall-db
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: '18'
    ipAllowList: []
