[package]
name = "feud-hall"
version = "0.1.0"
edition = "2021"
description = "Feud Hall restaurant-management game client"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-window-state = "=2.4.1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
