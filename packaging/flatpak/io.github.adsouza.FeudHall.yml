app-id: io.github.adsouza.FeudHall
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: feud-hall
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.secrets
modules:
  - name: feud-hall
    buildsystem: simple
    build-commands:
      - install -Dm755 feud-hall /app/bin/feud-hall
      - install -Dm644 io.github.adsouza.FeudHall.desktop /app/share/applications/io.github.adsouza.FeudHall.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.adsouza.FeudHall.png
      - install -Dm644 io.github.adsouza.FeudHall.metainfo.xml /app/share/metainfo/io.github.adsouza.FeudHall.metainfo.xml
    sources:
      - type: file
        path: feud-hall
      - type: file
        path: icon.png
      - type: file
        path: io.github.adsouza.FeudHall.desktop
      - type: file
        path: io.github.adsouza.FeudHall.metainfo.xml
